server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/asr/transcribe {
        # 最大 16 MiB 音频加少量 multipart 开销。只放宽语音接口。
        client_max_body_size 17m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 150s;
    }

    location ~ ^/api/v2/conversations/[0-9]+/files$ {
        # 给附件解析上限和 multipart 元数据留出空间，具体单文件上限由 API 校验。
        client_max_body_size 26m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # 内置浏览器帧/输入长连接（WebSocket）：必须转发 Upgrade 并关闭缓冲
    location ~ ^/api/v2/workspaces/browser-sessions/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 长连接：读超时必须大于最长静默（模型流停滞 120s + 断点重试间隔），
        # 否则事件流会被中途掐断
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
