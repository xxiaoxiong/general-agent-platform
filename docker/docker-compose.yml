name: general-agent-platform

# P0-04 部署安全：所有凭据经环境变量 / Secret 注入，文件内不保留默认密码。
# 启动前先准备 .env（参考 docker/.env.example），缺失必填变量时 compose 直接报错。
# MySQL/PostgreSQL/Redis 端口仅绑定 127.0.0.1，不对公网暴露。

# ── Knowledge Ingestion & RAG 共享配置（Backend 检索 + Worker 构建）────────
x-knowledge-env: &knowledge-env
  KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
  KNOWLEDGE_STORAGE_DIR: /app/data/knowledge
  KNOWLEDGE_MAX_UPLOAD_SIZE_MB: ${KNOWLEDGE_MAX_UPLOAD_SIZE_MB:-100}
  KNOWLEDGE_ALLOWED_FORMATS: ${KNOWLEDGE_ALLOWED_FORMATS:-pdf,docx,doc,xlsx,xls,pptx,ppt,txt,md,markdown,csv,html,htm,rtf,odt,ods,odp,png,jpg,jpeg,tif,tiff}
  KNOWLEDGE_PARSER_PROVIDER: ${KNOWLEDGE_PARSER_PROVIDER:-auto}
  KNOWLEDGE_OCR_ENABLED: ${KNOWLEDGE_OCR_ENABLED:-true}
  KNOWLEDGE_OCR_LANGUAGES: ${KNOWLEDGE_OCR_LANGUAGES:-ch,en}
  KNOWLEDGE_OCR_MIN_TEXT_CHARS: ${KNOWLEDGE_OCR_MIN_TEXT_CHARS:-24}
  KNOWLEDGE_OCR_MIN_SCORE: ${KNOWLEDGE_OCR_MIN_SCORE:-0.5}
  KNOWLEDGE_PARSE_TIMEOUT_SECONDS: ${KNOWLEDGE_PARSE_TIMEOUT_SECONDS:-300}
  KNOWLEDGE_MAX_PAGES: ${KNOWLEDGE_MAX_PAGES:-500}
  KNOWLEDGE_MAX_ARCHIVE_EXPANDED_BYTES: ${KNOWLEDGE_MAX_ARCHIVE_EXPANDED_BYTES:-1073741824}
  KNOWLEDGE_MAX_IMAGE_PIXELS: ${KNOWLEDGE_MAX_IMAGE_PIXELS:-50000000}
  KNOWLEDGE_CHUNK_SIZE_TOKENS: ${KNOWLEDGE_CHUNK_SIZE_TOKENS:-512}
  KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS:-64}
  KNOWLEDGE_PARENT_CHUNK_MAX_TOKENS: ${KNOWLEDGE_PARENT_CHUNK_MAX_TOKENS:-1536}
  KNOWLEDGE_CONTEXT_TOKEN_BUDGET: ${KNOWLEDGE_CONTEXT_TOKEN_BUDGET:-2400}
  KNOWLEDGE_WORKER_ENABLED: ${KNOWLEDGE_WORKER_ENABLED:-true}
  KNOWLEDGE_WORKER_CONCURRENCY: ${KNOWLEDGE_WORKER_CONCURRENCY:-2}
  KNOWLEDGE_WORKER_POLL_INTERVAL: ${KNOWLEDGE_WORKER_POLL_INTERVAL:-2}
  KNOWLEDGE_WORKER_HEARTBEAT_INTERVAL: ${KNOWLEDGE_WORKER_HEARTBEAT_INTERVAL:-15}
  KNOWLEDGE_JOB_LEASE_SECONDS: ${KNOWLEDGE_JOB_LEASE_SECONDS:-120}
  KNOWLEDGE_JOB_MAX_ATTEMPTS: ${KNOWLEDGE_JOB_MAX_ATTEMPTS:-3}
  KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-local}
  KNOWLEDGE_EMBEDDING_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-}
  KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
  KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
  KNOWLEDGE_EMBEDDING_DIMENSION: ${KNOWLEDGE_EMBEDDING_DIMENSION:-512}
  KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-16}
  KNOWLEDGE_QDRANT_URL: ${KNOWLEDGE_QDRANT_URL:-http://qdrant:6333}
  KNOWLEDGE_QDRANT_API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:-}
  KNOWLEDGE_QDRANT_COLLECTION_PREFIX: ${KNOWLEDGE_QDRANT_COLLECTION_PREFIX:-gap_knowledge}
  KNOWLEDGE_RETRIEVAL_MODE: ${KNOWLEDGE_RETRIEVAL_MODE:-hybrid}
  KNOWLEDGE_DENSE_TOP_K: ${KNOWLEDGE_DENSE_TOP_K:-30}
  KNOWLEDGE_BM25_TOP_K: ${KNOWLEDGE_BM25_TOP_K:-30}
  KNOWLEDGE_RRF_K: ${KNOWLEDGE_RRF_K:-60}
  KNOWLEDGE_MIN_DENSE_SCORE: ${KNOWLEDGE_MIN_DENSE_SCORE:-0.35}
  KNOWLEDGE_MIN_LEXICAL_COVERAGE: ${KNOWLEDGE_MIN_LEXICAL_COVERAGE:-0.2}
  KNOWLEDGE_RERANKER_ENABLED: ${KNOWLEDGE_RERANKER_ENABLED:-false}
  KNOWLEDGE_RERANKER_MODEL: ${KNOWLEDGE_RERANKER_MODEL:-BAAI/bge-reranker-base}
  KNOWLEDGE_RERANK_TOP_K: ${KNOWLEDGE_RERANK_TOP_K:-20}
  KNOWLEDGE_LEGACY_FALLBACK: ${KNOWLEDGE_LEGACY_FALLBACK:-true}

  # ── Conversation Memory（历史会话检索）────────────────────────────────
  CONVERSATION_MEMORY_ENABLED: ${CONVERSATION_MEMORY_ENABLED:-true}
  CONVERSATION_MEMORY_PLANNER_MODE: ${CONVERSATION_MEMORY_PLANNER_MODE:-llm}
  CONVERSATION_MEMORY_PLANNER_TIMEOUT: ${CONVERSATION_MEMORY_PLANNER_TIMEOUT:-25}
  CONVERSATION_MEMORY_PLANNER_MAX_TOKENS: ${CONVERSATION_MEMORY_PLANNER_MAX_TOKENS:-400}
  CONVERSATION_MEMORY_TOP_K: ${CONVERSATION_MEMORY_TOP_K:-5}
  CONVERSATION_MEMORY_CONTEXT_TOKEN_BUDGET: ${CONVERSATION_MEMORY_CONTEXT_TOKEN_BUDGET:-1200}
  CONVERSATION_MEMORY_DENSE_TOP_K: ${CONVERSATION_MEMORY_DENSE_TOP_K:-24}
  CONVERSATION_MEMORY_LEXICAL_TOP_K: ${CONVERSATION_MEMORY_LEXICAL_TOP_K:-24}
  CONVERSATION_MEMORY_MIN_DENSE_SCORE: ${CONVERSATION_MEMORY_MIN_DENSE_SCORE:-0.5}
  CONVERSATION_MEMORY_DENSE_STRONG_SCORE: ${CONVERSATION_MEMORY_DENSE_STRONG_SCORE:-0.62}
  CONVERSATION_MEMORY_DENSE_MARGIN: ${CONVERSATION_MEMORY_DENSE_MARGIN:-0.04}
  CONVERSATION_MEMORY_MAX_SCAN_ENTRIES: ${CONVERSATION_MEMORY_MAX_SCAN_ENTRIES:-4000}
  CONVERSATION_MEMORY_LOOKBACK_DAYS: ${CONVERSATION_MEMORY_LOOKBACK_DAYS:-730}
  CONVERSATION_MEMORY_INDEX_ENABLED: ${CONVERSATION_MEMORY_INDEX_ENABLED:-true}
  CONVERSATION_MEMORY_INDEX_INTERVAL: ${CONVERSATION_MEMORY_INDEX_INTERVAL:-2}
  CONVERSATION_MEMORY_INDEX_BATCH: ${CONVERSATION_MEMORY_INDEX_BATCH:-20}
  CONVERSATION_MEMORY_INDEX_MAX_ATTEMPTS: ${CONVERSATION_MEMORY_INDEX_MAX_ATTEMPTS:-3}
  CONVERSATION_MEMORY_TURN_MAX_CHARS: ${CONVERSATION_MEMORY_TURN_MAX_CHARS:-4000}
  CONVERSATION_MEMORY_SEGMENT_TURNS: ${CONVERSATION_MEMORY_SEGMENT_TURNS:-3}
  CONVERSATION_MEMORY_SEGMENT_MAX_CHARS: ${CONVERSATION_MEMORY_SEGMENT_MAX_CHARS:-3000}
  CONVERSATION_MEMORY_QDRANT_COLLECTION_PREFIX: ${CONVERSATION_MEMORY_QDRANT_COLLECTION_PREFIX:-gap_memory}
  CONVERSATION_MEMORY_INDEX_VERSION: ${CONVERSATION_MEMORY_INDEX_VERSION:-cvm1}

services:
  mysql:
    image: mysql:8.0
    container_name: ai_plat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_plat}
      MYSQL_USER: ${MYSQL_USER:-ai_plat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_plat_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL Checkpointer（Durable Execution）：多 Uvicorn Worker / 多容器
  # 共享 Graph State 的持久化后端（P0-01）。宿主机映射 5433 供集成测试直连。
  checkpoint_pg:
    image: postgres:16-alpine
    container_name: ai_plat_checkpoint_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_cp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agent_checkpoints}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - checkpoint_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Knowledge RAG：Qdrant 向量库（仅容器网络，不映射宿主/公网端口）─────
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: ai_plat_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${KNOWLEDGE_QDRANT_LOG_LEVEL:-WARN}
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # SearXNG 内网元搜索（web_search 工具的搜索引擎，方案 A：独立容器，不合并进 Backend 镜像）
  searxng:
    image: searxng/searxng:2026.11.23-a7163d091
    container_name: ai_plat_searxng
    restart: unless-stopped
    environment:
      # 运行时覆盖 settings.yml 中的占位 secret_key；密钥经 docker/.env 注入，不硬编码
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required (openssl rand -hex 32)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng_data:/var/cache/searxng
    # limiter 限流状态存储依赖 redis（valkey://redis:6379/1）
    depends_on:
      redis:
        condition: service_healthy
    # 仅容器网络内访问（Backend 经 http://searxng:8080），不映射宿主机/公网端口
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q OK"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  backend:
    build:
      # 构建上下文为仓库根目录，docker/ 目录集中存放部署文件
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        # pip 镜像加速（可改为 https://pypi.org/simple 或本地镜像）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ai_plat_backend
    restart: unless-stopped
    ports:
      # 仅回环绑定：Sandbox 不能经宿主机网关访问平台管理 API（生产再用反向代理暴露）
      - "127.0.0.1:8000:8000"
    environment:
      <<: *knowledge-env
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      DATABASE_SYNC_URL: mysql+pymysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}
      DEBUG: "false"
      UPLOAD_DIR: /app/data/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
      # 语音听写通过项目网络访问 ASR 服务。
      ASR_BASE_URL: ${ASR_BASE_URL-http://asr:8000}
      ASR_MODEL: ${ASR_MODEL:-sensevoice}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-60}
      ASR_MAX_UPLOAD_MB: ${ASR_MAX_UPLOAD_MB:-10}
      ASR_MAX_AUDIO_SECONDS: ${ASR_MAX_AUDIO_SECONDS:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (>=12 chars, change on first login)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 网页搜索：内网 SearXNG 元搜索（独立容器，经服务名访问）；留空则仅用外网引擎
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARCH_TIMEOUT: ${SEARCH_TIMEOUT:-25}
      # 提示词"当前时间"时区（容器为 UTC，避免北京时间凌晨日期差一天）
      AGENT_TIMEZONE: ${AGENT_TIMEZONE:-Asia/Shanghai}
      # 注意：默认值内的单引号属于 YAML 引用，不能放进 ${} 插值内部，
      # 否则会作为字面量混入 JSON 导致 json.loads 失败（启动崩溃）
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:80"]}'
      # Durable Execution：多 Worker 共享 PostgreSQL Checkpointer（禁止 memory）
      AGENT_CHECKPOINT_DSN: postgresql://${POSTGRES_USER:-ai_cp}:${POSTGRES_PASSWORD}@checkpoint_pg:5432/${POSTGRES_DB:-agent_checkpoints}
      # 跨线程长期记忆 Store（Phase 5 统一记忆事实来源，与 Checkpointer 同库）
      AGENT_STORE_DSN: postgresql://${POSTGRES_USER:-ai_cp}:${POSTGRES_PASSWORD}@checkpoint_pg:5432/${POSTGRES_DB:-agent_checkpoints}
      # 运行预算与断点重试（可在 docker/.env 覆盖）
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-1000}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-1000}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-1000}
      AGENT_RUN_TIMEOUT: ${AGENT_RUN_TIMEOUT:-0}
      # 语义决策（Decision Architecture）：off / shadow / llm
      AGENT_DECISION_MODE: ${AGENT_DECISION_MODE:-llm}
      AGENT_DECISION_TIMEOUT: ${AGENT_DECISION_TIMEOUT:-15}
      AGENT_DECISION_MAX_TOKENS: ${AGENT_DECISION_MAX_TOKENS:-600}
      # 工作任务编排层（Work Orchestrator）：off / shadow / auto（默认 shadow）
      AGENT_WORK_ORCHESTRATOR_MODE: ${AGENT_WORK_ORCHESTRATOR_MODE:-shadow}
      AGENT_WORK_PLAN_TIMEOUT: ${AGENT_WORK_PLAN_TIMEOUT:-30}
      AGENT_WORK_PLAN_MAX_TOKENS: ${AGENT_WORK_PLAN_MAX_TOKENS:-1200}
      AGENT_WORK_MAX_STEPS: ${AGENT_WORK_MAX_STEPS:-6}
      AGENT_WORK_MAX_REPLANS: ${AGENT_WORK_MAX_REPLANS:-1}
      AGENT_WORK_MAX_PARALLEL_STEPS: ${AGENT_WORK_MAX_PARALLEL_STEPS:-1}
      AGENT_AUTO_TEAM_ENABLED: ${AGENT_AUTO_TEAM_ENABLED:-false}
      AGENT_HITL_WAIT_COUNTS_TO_TIMEOUT: ${AGENT_HITL_WAIT_COUNTS_TO_TIMEOUT:-false}
      AGENT_INNER_TIMEOUT_RETRIES: ${AGENT_INNER_TIMEOUT_RETRIES:-1}
      AGENT_PROJECT_VERIFIER_DIR: ${AGENT_PROJECT_VERIFIER_DIR-/var/lib/project-verifier}
      # 代码执行逃生开关（仅开发/测评环境）：无外部沙箱时放行受限 python_exec，
      # 生产（APP_ENV=production）下代码强制忽略此开关
      AGENT_ALLOW_UNSAFE_PYTHON: ${AGENT_ALLOW_UNSAFE_PYTHON:-false}
      # Sandbox 模式：启用 Workspace Sandbox 时必须为 external，执行类工具才放行
      AGENT_SANDBOX_MODE: ${AGENT_SANDBOX_MODE:-restricted}
      # Agent 测评：Campaign 持久化 Worker（Lease / Heartbeat / 重启恢复）
      EVALUATION_WORKER_ENABLED: ${EVALUATION_WORKER_ENABLED:-true}
      EVALUATION_POLL_INTERVAL: ${EVALUATION_POLL_INTERVAL:-5.0}
      EVALUATION_WORKER_BATCH: ${EVALUATION_WORKER_BATCH:-2}
      EVALUATION_LEASE_SECONDS: ${EVALUATION_LEASE_SECONDS:-120}
      EVALUATION_HEARTBEAT_INTERVAL: ${EVALUATION_HEARTBEAT_INTERVAL:-20.0}
      EVALUATION_INFRA_RETRY_MAX: ${EVALUATION_INFRA_RETRY_MAX:-1}
      EVALUATION_JUDGE_MODEL_CONFIG_ID: ${EVALUATION_JUDGE_MODEL_CONFIG_ID:-0}
      # Workspace Sandbox Runtime（项目级持久化工作空间）
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_ROLLOUT_USER_IDS: ${SANDBOX_ROLLOUT_USER_IDS:-}
      SANDBOX_ROLLOUT_PROJECT_IDS: ${SANDBOX_ROLLOUT_PROJECT_IDS:-}
      SANDBOX_RUNNER_CONTROL_URL: ${SANDBOX_RUNNER_CONTROL_URL:-http://sandbox-runner:9100}
      SANDBOX_BACKEND_URL: ${SANDBOX_BACKEND_URL:-http://backend:8000}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-general-agent-platform/workspace-sandbox:1.0.0}
      SANDBOX_DEFAULT_PROFILE: ${SANDBOX_DEFAULT_PROFILE:-standard}
      SANDBOX_MAX_ACTIVE_PER_USER: ${SANDBOX_MAX_ACTIVE_PER_USER:-2}
      SANDBOX_MAX_ACTIVE_PER_TENANT: ${SANDBOX_MAX_ACTIVE_PER_TENANT:-20}
      SANDBOX_IDLE_TIMEOUT: ${SANDBOX_IDLE_TIMEOUT:-1800}
      SANDBOX_NETWORK_POLICY: ${SANDBOX_NETWORK_POLICY:-egress}
      SANDBOX_VOLUME_QUOTA_MODE: ${SANDBOX_VOLUME_QUOTA_MODE:-soft}
      SANDBOX_VOLUME_QUOTA_WARN_PERCENT: ${SANDBOX_VOLUME_QUOTA_WARN_PERCENT:-85}
      SANDBOX_CPU_RESERVE: ${SANDBOX_CPU_RESERVE:-2}
      SANDBOX_MEMORY_RESERVE: ${SANDBOX_MEMORY_RESERVE:-2048}
      SANDBOX_DISK_RESERVE: ${SANDBOX_DISK_RESERVE:-20}
      SANDBOX_RUNNER_DISK_GB: ${SANDBOX_RUNNER_DISK_GB:-100}
      SANDBOX_RECONCILE_INTERVAL: ${SANDBOX_RECONCILE_INTERVAL:-30}
      SANDBOX_JOB_LEASE_SECONDS: ${SANDBOX_JOB_LEASE_SECONDS:-90}
      SANDBOX_COMMAND_TIMEOUT: ${SANDBOX_COMMAND_TIMEOUT:-600}
      SANDBOX_SYNC_COMMAND_WAIT: ${SANDBOX_SYNC_COMMAND_WAIT:-30}
      # Preview：本地使用 {token}.localhost:8081；生产必须配置独立 https 域名
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-localhost}
      PREVIEW_PUBLIC_BASE_URL: ${PREVIEW_PUBLIC_BASE_URL:-}
      PREVIEW_TOKEN_TTL: ${PREVIEW_TOKEN_TTL:-3600}
      PREVIEW_MAX_CONNECTIONS: ${PREVIEW_MAX_CONNECTIONS:-16}
      PREVIEW_RATE_LIMIT_PER_MINUTE: ${PREVIEW_RATE_LIMIT_PER_MINUTE:-600}
      PREVIEW_REQUIRE_LOGIN: ${PREVIEW_REQUIRE_LOGIN:-false}
      PREVIEW_PROXY_PORT: ${PREVIEW_PROXY_PORT:-8081}
      PREVIEW_PROXY_HOST_PORT: ${PREVIEW_PROXY_HOST_PORT:-8081}
      # 内置浏览器（服务端 Chromium）：预览面板不依赖客户机访问 Preview 端口
      PREVIEW_INTERNAL_BASE_DOMAIN: ${PREVIEW_INTERNAL_BASE_DOMAIN:-preview.internal}
      BROWSER_SERVICE_URL: ${BROWSER_SERVICE_URL:-http://browser-service:9300}
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      BROWSER_SESSION_TTL: ${BROWSER_SESSION_TTL:-1800}
      BROWSER_SESSION_IDLE_TIMEOUT: ${BROWSER_SESSION_IDLE_TIMEOUT:-120}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-4}
      BROWSER_VIEWPORT_WIDTH: ${BROWSER_VIEWPORT_WIDTH:-1280}
      BROWSER_VIEWPORT_HEIGHT: ${BROWSER_VIEWPORT_HEIGHT:-800}
      BROWSER_FRAME_QUALITY: ${BROWSER_FRAME_QUALITY:-60}
      BROWSER_FRAME_INTERVAL_MS: ${BROWSER_FRAME_INTERVAL_MS:-70}
      UVICORN_WORKERS: "2"
      # Langfuse 可观测（对接宿主机 langfuse-deploy 栈；未配密钥时整条链路 no-op）
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-deploy-langfuse-web-1:3000}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3100}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
    volumes:
      - app_data:/app/data
      - ../log:/app/data/logs
      - project_verifier_queue:/var/lib/project-verifier
    networks:
      - default
      - langfuse
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      checkpoint_pg:
        condition: service_healthy
      searxng:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ── Workspace Sandbox：独立 Runner（唯一持有 Docker Socket 的平台服务）─────
  # 默认不启动；启用：docker compose --profile sandbox up -d
  sandbox-runner:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ai_plat_sandbox_runner
    restart: unless-stopped
    command: ["python", "-m", "app.sandbox_runner"]
    profiles: ["sandbox"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      DATABASE_SYNC_URL: mysql+pymysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      SANDBOX_RUNNER_ID: ${SANDBOX_RUNNER_ID:-runner-1}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_RUNNER_PORT: "9100"
      SANDBOX_BACKEND_URL: http://backend:8000
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-general-agent-platform/workspace-sandbox:1.0.0}
      SANDBOX_NETWORK_POLICY: ${SANDBOX_NETWORK_POLICY:-egress}
      SANDBOX_NETWORK_SUBNET_POOL: ${SANDBOX_NETWORK_SUBNET_POOL:-}
      SANDBOX_NETWORK_SUBNET_PREFIX: ${SANDBOX_NETWORK_SUBNET_PREFIX:-24}
      SANDBOX_DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_CPU_RESERVE: ${SANDBOX_CPU_RESERVE:-2}
      SANDBOX_MEMORY_RESERVE: ${SANDBOX_MEMORY_RESERVE:-2048}
      SANDBOX_DISK_RESERVE: ${SANDBOX_DISK_RESERVE:-20}
      SANDBOX_RUNNER_DISK_GB: ${SANDBOX_RUNNER_DISK_GB:-100}
      SANDBOX_RECONCILE_INTERVAL: ${SANDBOX_RECONCILE_INTERVAL:-30}
      SANDBOX_JOB_LEASE_SECONDS: ${SANDBOX_JOB_LEASE_SECONDS:-90}
      SANDBOX_JOB_HEARTBEAT_INTERVAL: ${SANDBOX_JOB_HEARTBEAT_INTERVAL:-20}
      SANDBOX_AGENT_PORT: ${SANDBOX_AGENT_PORT:-19999}
      AGENT_TIMEZONE: ${AGENT_TIMEZONE:-Asia/Shanghai}
    volumes:
      # 只有 Runner 允许挂载 Docker Socket；Backend / Preview Proxy / Sandbox 均不挂载
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    depends_on:
      backend:
        condition: service_started

  # ── Preview Proxy：Preview Grant 校验 + 子域路由（不持有 Docker Socket）────
  preview-proxy:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ai_plat_preview_proxy
    restart: unless-stopped
    command: ["python", "-m", "app.preview_proxy"]
    ports:
      # 仅回环绑定；生产通过独立 Preview 域名 + 反代暴露
      - "127.0.0.1:${PREVIEW_PROXY_HOST_PORT:-8081}:8081"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      DATABASE_SYNC_URL: mysql+pymysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-false}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_ROLLOUT_USER_IDS: ${SANDBOX_ROLLOUT_USER_IDS:-}
      SANDBOX_ROLLOUT_PROJECT_IDS: ${SANDBOX_ROLLOUT_PROJECT_IDS:-}
      SANDBOX_RUNNER_CONTROL_URL: ${SANDBOX_RUNNER_CONTROL_URL:-http://sandbox-runner:9100}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-localhost}
      PREVIEW_PUBLIC_BASE_URL: ${PREVIEW_PUBLIC_BASE_URL:-}
      PREVIEW_TOKEN_TTL: ${PREVIEW_TOKEN_TTL:-3600}
      PREVIEW_MAX_CONNECTIONS: ${PREVIEW_MAX_CONNECTIONS:-16}
      PREVIEW_RATE_LIMIT_PER_MINUTE: ${PREVIEW_RATE_LIMIT_PER_MINUTE:-600}
      PREVIEW_REQUIRE_LOGIN: ${PREVIEW_REQUIRE_LOGIN:-false}
      PREVIEW_PROXY_PORT: "8081"
      PREVIEW_PROXY_HOST_PORT: ${PREVIEW_PROXY_HOST_PORT:-8081}
      PREVIEW_INTERNAL_BASE_DOMAIN: ${PREVIEW_INTERNAL_BASE_DOMAIN:-preview.internal}
    networks:
      - default
    depends_on:
      backend:
        condition: service_started

  # ── 内置浏览器：服务端 Chromium（预览面板不依赖客户机访问 Preview 端口）──
  # 浏览器经内部域名 {token}.preview.internal 访问 Preview Proxy，仍走 Grant 校验；
  # 不映射宿主机端口、不挂载 Docker Socket。未配置 BROWSER_SERVICE_TOKEN 时拒绝服务。
  browser-service:
    build:
      context: ..
      dockerfile: docker/browser-service.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ai_plat_browser_service
    restart: unless-stopped
    environment:
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      BROWSER_SERVICE_PORT: "9300"
      BROWSER_PREVIEW_HOST: preview-proxy
      BROWSER_PREVIEW_DOMAIN: ${PREVIEW_INTERNAL_BASE_DOMAIN:-preview.internal}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-4}
      BROWSER_SESSION_TTL: ${BROWSER_SESSION_TTL:-1800}
      BROWSER_SESSION_IDLE_TIMEOUT: ${BROWSER_SESSION_IDLE_TIMEOUT:-120}
      BROWSER_VIEWPORT_WIDTH: ${BROWSER_VIEWPORT_WIDTH:-1280}
      BROWSER_VIEWPORT_HEIGHT: ${BROWSER_VIEWPORT_HEIGHT:-800}
      BROWSER_FRAME_QUALITY: ${BROWSER_FRAME_QUALITY:-60}
      BROWSER_FRAME_INTERVAL_MS: ${BROWSER_FRAME_INTERVAL_MS:-70}
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9300/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - default
    depends_on:
      preview-proxy:
        condition: service_started

  # ── Knowledge Ingestion Worker：Docling / OCR / Embedding / Qdrant 写入 ──
  # 独立进程（API 请求进程不执行 CPU 密集型解析）；数据库 Job 队列 + Lease/Heartbeat
  knowledge-worker:
    build:
      context: ..
      dockerfile: docker/knowledge-worker.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ai_plat_knowledge_worker
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.knowledge_worker"]
    environment:
      <<: *knowledge-env
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      DATABASE_SYNC_URL: mysql+pymysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AGENT_TIMEZONE: ${AGENT_TIMEZONE:-Asia/Shanghai}
      # 启动校验沿用生产规则（不连接 Checkpointer，仅要求非 memory DSN）
      AGENT_CHECKPOINT_DSN: postgresql://${POSTGRES_USER:-ai_cp}:${POSTGRES_PASSWORD}@checkpoint_pg:5432/${POSTGRES_DB:-agent_checkpoints}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "false"
    volumes:
      - app_data:/app/data
    mem_limit: 4g
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ── Sandbox 基础镜像（只构建不常驻）：docker compose --profile sandbox-image build
  workspace-sandbox-image:
    image: ${SANDBOX_IMAGE:-general-agent-platform/workspace-sandbox:1.0.0}
    build:
      context: ../sandbox
      dockerfile: Dockerfile
    profiles: ["sandbox-image"]
    command: ["true"]

  project_verifier:
    build:
      context: ..
      dockerfile: docker/project-verifier.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 160
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - project_verifier_queue:/var/lib/project-verifier

  asr:
    image: general-agent-platform-asr:local
    build:
      context: ../deploy/asr
    container_name: ai_plat_asr
    restart: unless-stopped
    volumes:
      - asr_model_cache:/var/cache/funasr
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; state = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)); assert state['device'] == 'cpu' and 'sensevoice' in state['models_loaded']"
      interval: 20s
      timeout: 5s
      start_period: 10m
      start_interval: 5s
      retries: 4

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: ai_plat_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

volumes:
  # 显式固定卷名：沿用项目改名前（ai-generalplat）已有的卷，避免重建容器时数据丢失
  mysql_data:
    name: ai-generalplat_mysql_data
  redis_data:
    name: ai-generalplat_redis_data
  app_data:
    name: ai-generalplat_app_data
  checkpoint_pg_data:
    name: ai-generalplat_checkpoint_pg_data
  # 知识库向量索引（Qdrant）：必须持久化，容器重建后索引仍在
  qdrant_data:
    name: ai-generalplat_qdrant_data
  # 沿用原独立部署的模型卷，新装环境由 Compose 创建。
  asr_model_cache:
    name: general-agent-platform-asr_model_cache
  project_verifier_queue:
  searxng_data:

networks:
  # 已部署的 Langfuse 栈（langfuse-deploy 项目）所在网络，用于 Trace 上报与评分回写
  langfuse:
    external: true
    name: langfuse-deploy_default
