name: general-agent-platform

# P0-04 部署安全：所有凭据经环境变量 / Secret 注入，文件内不保留默认密码。
# 启动前先准备 .env（参考 docker/.env.example），缺失必填变量时 compose 直接报错。
# MySQL/PostgreSQL/Redis 端口仅绑定 127.0.0.1，不对公网暴露。

services:
  mysql:
    image: mysql:8.0
    container_name: ai_plat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_plat}
      MYSQL_USER: ${MYSQL_USER:-ai_plat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_plat_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL Checkpointer（Durable Execution）：多 Uvicorn Worker / 多容器
  # 共享 Graph State 的持久化后端（P0-01）。宿主机映射 5433 供集成测试直连。
  checkpoint_pg:
    image: postgres:16-alpine
    container_name: ai_plat_checkpoint_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_cp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agent_checkpoints}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - checkpoint_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # 构建上下文为仓库根目录，docker/ 目录集中存放部署文件
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        # pip 镜像加速（可改为 https://pypi.org/simple 或本地镜像）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    container_name: ai_plat_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      DATABASE_SYNC_URL: mysql+pymysql://${MYSQL_USER:-ai_plat}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-ai_plat}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required (openssl rand -hex 32)}
      DEBUG: "false"
      UPLOAD_DIR: /app/data/uploads
      CHROMA_PERSIST_DIR: /app/data/chroma
      # 语音听写通过项目网络访问 ASR 服务。
      ASR_BASE_URL: ${ASR_BASE_URL-http://asr:8000}
      ASR_MODEL: ${ASR_MODEL:-sensevoice}
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-60}
      ASR_MAX_UPLOAD_MB: ${ASR_MAX_UPLOAD_MB:-10}
      ASR_MAX_AUDIO_SECONDS: ${ASR_MAX_AUDIO_SECONDS:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (>=12 chars, change on first login)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # 注意：默认值内的单引号属于 YAML 引用，不能放进 ${} 插值内部，
      # 否则会作为字面量混入 JSON 导致 json.loads 失败（启动崩溃）
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:80"]}'
      # Durable Execution：多 Worker 共享 PostgreSQL Checkpointer（禁止 memory）
      AGENT_CHECKPOINT_DSN: postgresql://${POSTGRES_USER:-ai_cp}:${POSTGRES_PASSWORD}@checkpoint_pg:5432/${POSTGRES_DB:-agent_checkpoints}
      # 跨线程长期记忆 Store（Phase 5 统一记忆事实来源，与 Checkpointer 同库）
      AGENT_STORE_DSN: postgresql://${POSTGRES_USER:-ai_cp}:${POSTGRES_PASSWORD}@checkpoint_pg:5432/${POSTGRES_DB:-agent_checkpoints}
      # 运行预算与断点重试（可在 docker/.env 覆盖）
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-1000}
      AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-1000}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-1000}
      AGENT_RUN_TIMEOUT: ${AGENT_RUN_TIMEOUT:-0}
      AGENT_HITL_WAIT_COUNTS_TO_TIMEOUT: ${AGENT_HITL_WAIT_COUNTS_TO_TIMEOUT:-false}
      AGENT_INNER_TIMEOUT_RETRIES: ${AGENT_INNER_TIMEOUT_RETRIES:-1}
      AGENT_PROJECT_VERIFIER_DIR: ${AGENT_PROJECT_VERIFIER_DIR-/var/lib/project-verifier}
      # 代码执行逃生开关（仅开发/测评环境）：无外部沙箱时放行受限 python_exec，
      # 生产（APP_ENV=production）下代码强制忽略此开关
      AGENT_ALLOW_UNSAFE_PYTHON: ${AGENT_ALLOW_UNSAFE_PYTHON:-false}
      UVICORN_WORKERS: "2"
      # Langfuse 可观测（对接宿主机 langfuse-deploy 栈；未配密钥时整条链路 no-op）
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-deploy-langfuse-web-1:3000}
      LANGFUSE_PUBLIC_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:3100}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
    volumes:
      - app_data:/app/data
      - ../log:/app/data/logs
      - project_verifier_queue:/var/lib/project-verifier
    networks:
      - default
      - langfuse
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      checkpoint_pg:
        condition: service_healthy

  project_verifier:
    build:
      context: ..
      dockerfile: docker/project-verifier.Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 160
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    volumes:
      - project_verifier_queue:/var/lib/project-verifier

  asr:
    image: general-agent-platform-asr:local
    build:
      context: ../deploy/asr
    container_name: ai_plat_asr
    restart: unless-stopped
    volumes:
      - asr_model_cache:/var/cache/funasr
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; state = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)); assert state['device'] == 'cpu' and 'sensevoice' in state['models_loaded']"
      interval: 20s
      timeout: 5s
      start_period: 10m
      start_interval: 5s
      retries: 4

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: ai_plat_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  # 显式固定卷名：沿用项目改名前（ai-generalplat）已有的卷，避免重建容器时数据丢失
  mysql_data:
    name: ai-generalplat_mysql_data
  redis_data:
    name: ai-generalplat_redis_data
  app_data:
    name: ai-generalplat_app_data
  checkpoint_pg_data:
    name: ai-generalplat_checkpoint_pg_data
  # 沿用原独立部署的模型卷，新装环境由 Compose 创建。
  asr_model_cache:
    name: general-agent-platform-asr_model_cache
  project_verifier_queue:

networks:
  # 已部署的 Langfuse 栈（langfuse-deploy 项目）所在网络，用于 Trace 上报与评分回写
  langfuse:
    external: true
    name: langfuse-deploy_default
